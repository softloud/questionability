version: 2

models:

  - name: se_euc__team__model
    description: Eucalyptus study source data. Bungonia removed because they did not fill in the model reporting survey correctly.
    columns:
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('se_euc__team')
                field: team_id
              config:
                error_if: ">0"
                warn_if: ">0"
      - name: model_id
        data_tests:
          - unique
          - not_null
  

  - name: se_tit__team__model
    description: Blue tit study source data.
    columns:
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('se_tit__team')
                field: team_id
              config:
                severity: warn
      - name: model_id
        data_tests:
          - unique
          - not_null

  - name: se_euc__column
    description: Eucalyptus study column metadata.
    columns:
      - name: column_id
        data_tests:
          - unique
          - not_null

  - name: se_tit__column
    description: Blue tit study column metadata.
    columns:
      - name: column_id
        data_tests:
          - unique
          - not_null

  - name: se_euc__team
    description: Eucalyptus study team metadata. Bungonia removed because they did not fill in the model reporting survey correctly.
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null

  - name: se_tit__team
    description: Blue tit study team metadata.
    columns:
      - name: team_id
        data_tests:
          - unique
          - not_null

  - name: se_euc__team__model__column
    description: Eucalyptus study team model column metadata. Bungonia removed because they did not fill in the model reporting survey correctly.
    data_tests:
      - unique_combination_of_columns:
          combination_of_columns:
            - source_id
            - model_id
            - column_id
    columns:
      - name: model_id
        data_tests:
          - not_null
      - name: column_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null